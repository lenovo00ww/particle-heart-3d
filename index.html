<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="An interactive heart sculpted from blue light. Drag to rotate it and tap to scatter sparks.">
  <title>Blue Particle Heart</title>
</head>
<body>
  <main id="experience" aria-label="Blue Particle Heart">
    <div id="stage"></div>
    <p id="status" role="status" hidden></p>
    <div class="dock" aria-label="Scene controls">
      <div id="settings" class="settings">
        <button id="play" type="button">Pause</button>
        <label>Rotation <input id="speed" type="range" min="0" max="2" step=".05" value="1" aria-label="Rotation speed"></label>
        <label>Glow <input id="glow" type="range" min="0" max="1.5" step=".05" value=".8" aria-label="Glow intensity"></label>
        <button id="fullscreen" type="button" hidden>Fullscreen</button>
      </div>
      <button id="toggle" type="button" aria-controls="settings" aria-expanded="true">Hide controls</button>
    </div>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
